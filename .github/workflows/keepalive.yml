name: keepalive
# GitHub disables scheduled workflows in public repos after 60 days without repository activity. This pushes a tiny commit weekly.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "newsroom-bot" && git config user.email "newsroom-bot@users.noreply.github.com"
          git checkout -q --orphan keepalive && git rm -rq --cached . && git commit -q --allow-empty -m "keepalive $(date -u +%FT%TZ)"
          git push -q -f origin keepalive
