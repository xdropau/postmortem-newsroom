name: cycle
# Bots 01-03 (news radar, primary sources, trends), story scoring, alerts and Telegram commands. Every 15 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: newsroom-data
  cancel-in-progress: false
permissions:
  contents: write   # only to push the approved-only feed to the public site-data branch
  actions: write    # only to restart the button watcher if it has stopped
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_DIR: data
      DATA_REPO: ${{ vars.DATA_REPO }}
      DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/data_pull.sh
      - name: Run cycle
        run: python -m newsroom cycle
      - name: Publish approved feed
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_site.sh
      - name: Check the button watcher is running
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m newsroom tapwatch-check
      - name: Save data
        if: always()
        run: bash scripts/data_push.sh
