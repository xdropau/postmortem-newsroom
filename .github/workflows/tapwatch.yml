name: tapwatch
# Instant answer to Telegram button taps. One watcher runs at a time (about 50 minutes each); the next one waits in the queue and
# starts the moment the previous one ends, so the cron only has to fire once in a while. It answers the tap within seconds and starts
# the `taps` workflow, which does the real work. Free: this repository is public, so Actions minutes are unlimited.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
concurrency:
  group: tapwatch
  cancel-in-progress: false
permissions:
  actions: write      # only to start the `taps` workflow
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAPWATCH_MINUTES: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m newsroom.tapwatch
      - name: Start the next watcher (so the chain does not depend on the cron)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run tapwatch.yml --repo "$GITHUB_REPOSITORY" --ref main || true
