name: ops
# Manual tools: feed audit, live self-test, acceptance report, forced briefing, Telegram test card, weekly link check.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        required: true
        options: [audit, selftest, acceptance, briefing-force, testcard, linkwatch, samplecard, shopify-drafts-dry, shopify-drafts, shopify-selftest, shopify-list, shopify-audit, shopify-publish-checked, shopify-publish-ids, shopify-hide, shopify-dates, shopify-article-setup, story-record, owner-approve, golive, mojibake-scan, mojibake-fix, set-youtube]
      arg:
        description: "Optional: YouTube video ids (comma separated) for shopify-publish-ids, or an article address name for shopify-hide, or STORYID|https://www.youtube.com/watch?v=ID for set-youtube"
        type: string
        required: false

concurrency:
  group: newsroom-data
  cancel-in-progress: false
permissions:
  contents: write   # only to publish the approved-only feed to the public site-data branch
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: data
      DATA_REPO: ${{ vars.DATA_REPO }}
      DATA_DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TASK: ${{ inputs.task }}
      ARG: ${{ inputs.arg }}
      SHOPIFY_STORE: ${{ vars.SHOPIFY_STORE }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: bash scripts/data_pull.sh
      - name: Run task
        run: |
          case "$TASK" in
            audit) python -m newsroom audit ;;
            selftest) python -m newsroom selftest ;;
            acceptance) python -m newsroom acceptance | tee "$GITHUB_STEP_SUMMARY" ;;
            briefing-force) python -m newsroom briefing --force ;;
            testcard) python -m newsroom testcard ;;
            samplecard) python -m newsroom samplecard ;;
            shopify-drafts-dry) python -m newsroom shopify-drafts dry-run ;;
            shopify-drafts) python -m newsroom shopify-drafts ;;
            shopify-selftest) python -m newsroom shopify-drafts selftest ;;
            shopify-list) python -m newsroom shopify-drafts list ;;
            shopify-audit) python -m newsroom shopify-drafts audit ;;
            shopify-publish-ids) python -m newsroom shopify-drafts "publish:$ARG" ;;
            shopify-hide) python -m newsroom shopify-drafts "hide:$ARG" ;;
            shopify-dates) python -m newsroom shopify-drafts dates ;;
            shopify-article-setup) python -m newsroom shopify-drafts "article-setup:$ARG" ;;
            story-record) python -m newsroom shopify-drafts "story-record:$ARG" ;;
            owner-approve) python -m newsroom shopify-drafts "owner-approve:$ARG" ;;
            golive) python -m newsroom shopify-drafts "golive:$ARG" ;;
            set-youtube) python -m newsroom shopify-drafts "set-youtube:$ARG" ;;
            mojibake-scan) python -m newsroom shopify-drafts "mojibake:scan" ;;
            mojibake-fix) python -m newsroom shopify-drafts "mojibake:fix" ;;
            shopify-publish-checked) python -m newsroom shopify-drafts publish ;;
            linkwatch) python -m newsroom linkwatch ;;
          esac
      - name: Save data
        if: always()
        run: bash scripts/data_push.sh
